<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wielki Wyścig — reel renderer</title>
<!-- Offline renderer for the highlight reel (scripts/reel). Not part of the app build. -->
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #labels { display: none; }
  #out { position: fixed; left: 0; top: 0; z-index: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<canvas id="out"></canvas>
<script type="module" src="/src/reel/main.js"></script>
</body>
</html>
